  <div id="pinModal" class="fixed inset-0 z-50 bg-slate-950/80 modal-backdrop flex items-center justify-center p-4">

        <input id="pinInput" type="password" maxlength="8" inputmode="numeric" placeholder="PINコード (初期: 1234)"

        <a href="../" target="_blank" rel="noopener" class="text-xs text-slate-400 hover:text-blue-500 transition underline underline-offset-4">

        <div>

          </div>
          <p class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">ここをタップして写真を選択 または 撮影</p>

    <!-- Result Skeleton Section -->

  <!-- Settings Modal -->

          <select id="speechRateSelect" class="w-full p-2.5 border rounded-xl dark:bg-slate-900 dark:border-slate-700 dark:text-white">

            <option value="0.95" selected>標準 (0.95x)</option>

          </select>
        </div>
      </div>

      <div class="pt-3 border-t dark:border-slate-700 flex gap-2">
        <button onclick="closeSettings()" class="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300">

        <button onclick="saveSettings()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold shadow-md shadow-blue-600/30">

  <!-- Shared Toast Notification Container -->
  <div id="toastNotification" class="hidden"></div>

  <!-- Shared Scripts -->
  <script src="../shared/storage.js?v=20261027"></script>
  <script src="../shared/core.js?v=20261027"></script>
  <script src="../shared/speech.js?v=20261027"></script>
  <script src="../shared/ui.js?v=20261027"></script>

  <!-- English App Logic -->
  <script>
    // 共有ストレージの初期化（共通設定 + 英語専用 aet_ prefix）
    const sharedStore = window.TutorStorage ? window.TutorStorage.create({ prefix: 'tutor_', legacyPrefixes: ['amt_'] }) : null;
    const engStore = window.TutorStorage ? window.TutorStorage.create({ prefix: 'aet_', legacyPrefixes: [''] }) : null;

    // 英語音声エンジン (en-US 優先)
    const englishSpeech = window.TutorSpeech ? window.TutorSpeech.create({
      lang: 'en-US',
      defaultRate: 0.95,
      voicePriority: [/samantha|ava|daniel/i, /google us english/i, /natural|online/i]
    }) : null;

    let currentImageBase64 = null;
    let lastPassageEn = '';

    const ENGLISH_SCHEMA = {
      type: 'object',
      properties: {
        passage_en: { type: 'string', description: '英語の本文または書き起こしテキスト' },
        translation_ja: { type: 'string', description: '自然でわかりやすい日本語訳' },
        vocabulary: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              word: { type: 'string' },
              meaning: { type: 'string' },
              example: { type: 'string' }
            },
            required: ['word', 'meaning']
          }
        },
        grammar_points: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              title: { type: 'string' },
              explanation: { type: 'string' }
            },
            required: ['title', 'explanation']
          }
        },
        quick_check: {
          type: 'object',
          properties: {
            question: { type: 'string' },
            answer: { type: 'string' }
          }
        }
      },
      required: ['passage_en', 'translation_ja']
    };

    window.addEventListener('DOMContentLoaded', () => {
      // ダークモード初期化
      if (window.TutorUI) {
        window.TutorUI.initDarkMode({ storage: sharedStore, key: 'dark_mode' });
        window.TutorUI.updateSafeArea();
      }

      // PINモーダル制御 (セッションで解錠済みならスキップ)
      if (sessionStorage.getItem('aet_unlocked') === '1') {
        document.getElementById('pinModal').style.display = 'none';
      }

      // 音声速度復元
      const savedRate = engStore ? engStore.getItem('speech_rate') : null;
      if (savedRate && document.getElementById('speechRateSelect')) {
        document.getElementById('speechRateSelect').value = savedRate;
      }

      // PWA Service Worker 登録 (English scope)
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('./sw.js').catch((e) => {
          console.warn('English SW registration error:', e);
        });
      }
    });

    function unlockApp() {
      const input = document.getElementById('pinInput').value.trim();
      const savedPin = (sharedStore ? (sharedStore.getItem('app_pin') || sharedStore.getItem('pin')) : null) || '1234';
      if (input === savedPin) {
        document.getElementById('pinModal').style.display = 'none';
        sessionStorage.setItem('aet_unlocked', '1');
      } else {
        document.getElementById('pinError').classList.remove('hidden');
      }
    }

    function toggleDarkMode() {
      if (window.TutorUI) {
        window.TutorUI.toggleDarkMode({ storage: sharedStore, key: 'dark_mode' });
      }
    }

    function openSettings() {
      const key = sharedStore ? sharedStore.getItem('gemini_api_key') : '';
      const pin = sharedStore ? (sharedStore.getItem('app_pin') || sharedStore.getItem('pin') || '1234') : '1234';
      document.getElementById('geminiKeyInput').value = key || '';
      document.getElementById('newPinInput').value = pin;
      window.TutorUI.openModal('settingsModal');
    }

    function closeSettings() {
      window.TutorUI.closeModal('settingsModal');
    }

    function saveSettings() {
      const key = document.getElementById('geminiKeyInput').value.trim();
      const pin = document.getElementById('newPinInput').value.trim() || '1234';
      const rate = document.getElementById('speechRateSelect').value;

      if (sharedStore) {
        sharedStore.setItem('gemini_api_key', key);
        sharedStore.setItem('app_pin', pin);
        sharedStore.setItem('pin', pin);
      }
      if (engStore) {
        engStore.setItem('speech_rate', rate);
      }

      closeSettings();
      window.TutorUI.showToast('✅ 設定を保存しました。', 'green');
    }

    function handleImageUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1400;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          currentImageBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

          document.getElementById('uploadPrompt').classList.add('hidden');
          const preview = document.getElementById('imagePreview');
          preview.src = canvas.toDataURL('image/jpeg', 0.85);
          preview.classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    async function analyzeEnglishProblem() {
      const geminiKey = sharedStore ? sharedStore.getItem('gemini_api_key') : null;
      if (!geminiKey) {
        openSettings();
        window.TutorUI.showToast('🔑 先に設定からGemini APIキーを入力してください。', 'amber');
        return;
      }

      const userText = document.getElementById('questionInput').value.trim();
      if (!currentImageBase64 && !userText) {
        window.TutorUI.showToast('⚠️ 写真を撮影するか、質問テキストを入力してください。', 'amber');
        return;
      }

      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'rounded-2xl p-4 text-xs font-bold border bg-blue-50 border-blue-200 text-blue-900 dark:bg-blue-950/60 dark:border-blue-800 dark:text-blue-100';
      statusBox.innerHTML = '⏳ AI英語先生が英文を解析しています…（最大20秒）';
      statusBox.classList.remove('hidden');

      const prompt = `あなたは日本の高校生向けに教える優秀で親切なAI英語チューターです。
添付された画像または質問テキストを解析し、以下の構造で分かりやすく解説してください：
1. 英文の書き起こし（passage_en）
2. 自然で分かりやすい日本語全訳（translation_ja）
3. 重要語彙・イディオム（vocabulary）: 単語、意味、例文
4. 重要文法・構文のポイント（grammar_points）: タイトル、解説
5. 類題または確認クイズ（quick_check）: 問題、解答`;

      try {
        const selectedModel = (sharedStore ? sharedStore.getItem('selected_model') : null) || 'gemini-2.5-flash';
        const data = await window.TutorCore.callGeminiModel({
          modelId: selectedModel,
          apiKey: geminiKey,
          promptText: `${prompt}\n\n生徒の追加質問: ${userText || 'なし'}`,
          imageBase64: currentImageBase64,
          schema: ENGLISH_SCHEMA,
          temperature: 0.35
        });

        lastPassageEn = data.passage_en || '';
        statusBox.classList.add('hidden');

        renderEnglishResult(data);
        document.getElementById('resultSection').classList.remove('hidden');
        window.TutorUI.showToast('✨ 英語の解説が完成しました！', 'green');
      } catch (err) {
        console.error(err);
        statusBox.className = 'rounded-2xl p-4 text-xs font-bold border bg-red-50 border-red-200 text-red-900 dark:bg-red-950/60 dark:border-red-800 dark:text-red-100';
        statusBox.textContent = `❌ エラーが発生しました: ${err.message || '通信エラー'}`;
      }
    }

    function renderEnglishResult(data) {
      const resultContent = document.getElementById('resultContent');
      if (!resultContent) return;

      const vocabList = (data.vocabulary || []).map(v => `
        <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60">
          <div class="flex items-baseline justify-between gap-2">
            <span class="font-bold text-blue-700 dark:text-blue-400 text-sm">${escapeHtml(v.word)}</span>
            <span class="text-xs text-slate-600 dark:text-slate-300 font-medium">${escapeHtml(v.meaning)}</span>
          </div>
          ${v.example ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 italic">例: "${escapeHtml(v.example)}"</p>` : ''}
        </div>
      `).join('');

      const grammarList = (data.grammar_points || []).map(g => `
        <div class="p-3 rounded-xl bg-indigo-50/50 dark:bg-indigo-950/30 border border-indigo-200/60 dark:border-indigo-800/60 space-y-1">
          <div class="font-bold text-xs text-indigo-900 dark:text-indigo-200 flex items-center gap-1.5">
            <span>💡</span>
            <span>${escapeHtml(g.title)}</span>
          </div>
          <p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">${escapeHtml(g.explanation)}</p>
        </div>
      `).join('');

      resultContent.innerHTML = `
        <!-- 英文本文 -->
        <div class="p-4 rounded-2xl bg-blue-50/60 dark:bg-blue-950/40 border border-blue-200/70 dark:border-blue-900/60 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-blue-900 dark:text-blue-200 flex items-center gap-1.5">
              <span>📖</span>
              <span>英文 (Passage)</span>
            </span>
          </div>
          <p class="text-sm font-serif leading-relaxed text-slate-900 dark:text-slate-100 whitespace-pre-wrap">${escapeHtml(data.passage_en || '')}</p>
        </div>

        <!-- 日本語全訳 -->
        <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60 space-y-2">
          <div class="font-bold text-xs text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
            <span>🇯🇵</span>
            <span>日本語訳 (Translation)</span>
          </div>
          <p class="text-xs sm:text-sm leading-relaxed text-slate-700 dark:text-slate-300 whitespace-pre-wrap">${escapeHtml(data.translation_ja || '')}</p>
        </div>

        <!-- 重要語彙 -->
        ${vocabList ? `
        <div class="space-y-2">
          <div class="font-bold text-xs text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
            <span>🔤</span>
            <span>重要単語・表現 (Vocabulary)</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${vocabList}
          </div>
        </div>
        ` : ''}

        <!-- 文法ポイント -->
        ${grammarList ? `
        <div class="space-y-2">
          <div class="font-bold text-xs text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
            <span>🧩</span>
            <span>重要文法・構文のポイント (Grammar Focus)</span>
          </div>
          <div class="space-y-2">
            ${grammarList}
          </div>
        </div>
        ` : ''}

        <!-- 確認クイズ -->
        ${data.quick_check && data.quick_check.question ? `
        <div class="p-4 rounded-2xl bg-amber-50/60 dark:bg-amber-950/30 border border-amber-200/70 dark:border-amber-800/60 space-y-2">
          <div class="font-bold text-xs text-amber-900 dark:text-amber-200 flex items-center gap-1.5">
            <span>🎯</span>
            <span>理解度チェック (Quick Check)</span>
          </div>
          <p class="text-xs text-slate-800 dark:text-slate-200 font-bold">${escapeHtml(data.quick_check.question)}</p>
          <details class="text-xs text-amber-800 dark:text-amber-300 cursor-pointer pt-1">
            <summary class="font-bold">答えを見る</summary>
            <p class="mt-1 p-2 rounded-lg bg-white/70 dark:bg-slate-900/60 border border-amber-200 dark:border-amber-800/60">${escapeHtml(data.quick_check.answer)}</p>
          </details>
        </div>
        ` : ''}
      `;
    }

    function playEnglishSpeech() {
      if (!englishSpeech || !lastPassageEn) {
        window.TutorUI.showToast('⚠️ 読み上げる英文がありません。', 'amber');
        return;
      }
      const rate = parseFloat(document.getElementById('speechRateSelect')?.value || '0.95');
      englishSpeech.speak(lastPassageEn, { rate });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
